name: Publicar frontend en GitHub Pages

# Ejecuta la publicación cuando se suben cambios a main.
on:
  push:
    branches:
      - main

  # Permite iniciar el flujo manualmente desde GitHub.
  workflow_dispatch:

# Permisos necesarios para publicar GitHub Pages.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Evita publicaciones simultáneas.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar frontend
    runs-on: ubuntu-latest

    steps:
      # Descarga el contenido del repositorio.
      - name: Descargar repositorio
        uses: actions/checkout@v6

      # Prepara Node.js para instalar y compilar React.
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Instala las dependencias dentro de frontend.
      # Se utiliza npm install porque puede sincronizar
      # package.json con package-lock.json.
      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm install

      # Ejecuta Vite y genera frontend/dist.
      - name: Compilar aplicación React
        working-directory: ./frontend
        run: npm run build

      # Configura los datos necesarios para GitHub Pages.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      # Guarda la carpeta compilada como artefacto.
      - name: Preparar archivos de publicación
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend/dist

  deploy:
    name: Publicar aplicación
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publica el artefacto generado en GitHub Pages.
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
