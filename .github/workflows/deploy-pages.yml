name: Publicar frontend en GitHub Pages

# El despliegue se ejecuta automáticamente
# cuando se envían cambios a la rama main.
on:
  push:
    branches:
      - main

  # También permite ejecutarlo manualmente
  # desde la sección Actions de GitHub.
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos despliegues se ejecuten al mismo tiempo.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar frontend
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio.
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Instala Node.js para ejecutar Vite.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Instala exactamente las dependencias
      # registradas en package-lock.json.
      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      # Genera la carpeta frontend/dist.
      - name: Compilar aplicación React
        working-directory: ./frontend
        run: npm run build

      # Prepara GitHub Pages para recibir
      # los archivos compilados.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # Guarda el contenido de dist como
      # artefacto que será publicado.
      - name: Preparar archivos de publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    name: Publicar aplicación
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # Publica el artefacto generado
      # por el trabajo de compilación.
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4