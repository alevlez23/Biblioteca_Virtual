<!doctype html>
<html lang="es">
  <head>
    <!-- Metadatos básicos para codificación, responsive y color del navegador. -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Sistema administrativo de Biblioteca Virtual"
    />

    <meta
      name="theme-color"
      content="#070b18"
    />

    <!-- Icono mostrado en la pestaña del navegador. -->
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%favicon.png"
    />

    <title>Biblioteca Virtual</title>
  </head>

  <body>
    <!-- React reemplaza este contenedor con toda la aplicación. -->
    <div id="root"></div>

    <!-- main.jsx es el punto de entrada cargado como módulo de JavaScript. -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
